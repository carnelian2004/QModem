name: "Build QModem x64 (IPK + APK)"
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build QModem for ${{ matrix.build_arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_arch: ["x64_ipk", "x64_apk"]
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget

      - name: Checkout QModem source
        uses: actions/checkout@v5
        with:
          path: qmodem

      - name: Import environment (${{ matrix.build_arch }}.env)
        run: cat qmodem/.github/workflows/${{ matrix.build_arch }}.env >> "$GITHUB_ENV"

      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: sdk
          key: sdk-${{ matrix.build_arch }}

      - name: Download and extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          url_sdk: ${{ env.SDK_URL }}${{ env.SDK_NAME}}.${{ env.SDK_EXT }}
        run: |
          wget "${{ env.url_sdk }}"
          file_name="${{ env.SDK_NAME }}.${{ env.SDK_EXT }}"
          mkdir sdk
          if [[ "${{ env.SDK_EXT }}" == "tar.zst" ]]; then
            tar --zstd -xvf "$file_name" -C ./sdk --strip-components=1
          else
            tar -xvf "$file_name" -C ./sdk --strip-components=1
          fi
          cd sdk
          echo "src-link qmodem $(pwd)/../qmodem" >> feeds.conf
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem
          echo "CONFIG_PACKAGE_qmodem=m" > .config
          echo "CONFIG_PACKAGE_luci-app-qmodem=m" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig
          make download -j$(nproc) || true

      - name: Compile QModem
        id: compile
        run: |
          cd sdk
          make package/qmodem/compile -j$(nproc) V=s
          mkdir -p ../output
          # 根据编译格式复制对应后缀的文件
          if [[ "${{ matrix.build_arch }}" == *"ipk" ]]; then
            find bin/packages -name "*.ipk" -exec cp {} ../output/ \;
          else
            find bin/packages -name "*.apk" -exec cp {} ../output/ \;
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: QModem-${{ matrix.build_arch }}
          path: output/
